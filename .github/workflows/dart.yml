name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: Front-end
        run: flutter pub get

      - name: Create required .env asset
        working-directory: Front-end
        run: touch .env

      - name: Analyze project source
        working-directory: Front-end
        run: flutter analyze --no-fatal-infos lib

      - name: Run tests
        working-directory: Front-end
        run: flutter test
